name: Build Focus Feasibility APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extract source project
        run: unzip -q focus_feasibility_test_source.zip -d project

      - name: Fix overlay self-trigger flicker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/src/main/java/com/example/focusfeasibility/AppWatchAccessibilityService.kt")
          s = p.read_text(encoding="utf-8")
          old = '''        if (pkg == packageName || MainActivity.isCriticalPackage(pkg)) {
            removeOverlay()
            return
        }'''
          new = '''        // The overlay belongs to this app. Ignore its own window events;
        // removing the overlay here caused a show/remove loop and visible flicker.
        if (pkg == packageName) return

        if (MainActivity.isCriticalPackage(pkg)) {
            removeOverlay()
            return
        }'''
          if old not in s:
              raise SystemExit("Expected overlay event-handling block was not found; stopping without building.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("Patched accessibility overlay self-trigger handling.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          build-root-directory: project
          cache-provider: basic
          validate-wrappers: false

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-feasibility-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
